{% extends 'base.html' %}{% block content %}<section class="panel"><h1>تنظيف السجل</h1><p>يُنظف الملف محليًا، ولا يغيّر الملف الأصلي ولا يرسله إلى خدمة خارجية.</p><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>ملف السجل<input required type="file" name="log_file" accept=".log,.txt,.csv,.json,.xml"></label><label>الوضع<select name="mode"><option value="redaction">حذف القيم</option><option value="masking">إخفاء جزئي</option><option value="pseudonymization">أسماء بديلة ثابتة</option></select></label><button>معاينة</button><button name="download" value="1">تنزيل النسخة المنظفة</button></form>{% if preview is not none %}<div class="preview-grid"><div><h2>قبل التنظيف</h2><pre>{{ before }}</pre></div><div><h2>بعد التنظيف</h2><pre>{{ preview }}</pre></div></div><p>العناصر المخفية: {{ counts }}</p>{% endif %}</section>{% endblock %}
